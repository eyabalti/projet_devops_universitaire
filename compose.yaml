services:
  mysql:
    image: mysql:8.4
    container_name: univ-mysql
    environment:
      MYSQL_DATABASE: universite
      MYSQL_USER: universite
      MYSQL_PASSWORD: ${DB_PASSWORD:-universite123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [backend]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-p${MYSQL_ROOT_PASSWORD:-root-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: gestion-universitaire:local
    container_name: univ-app
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: universite
      DB_USER: universite
      DB_PASSWORD: ${DB_PASSWORD:-universite123}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend, frontend]
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: univ-nginx
    ports: ["80:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [frontend]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: univ-prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [frontend]
    depends_on: [app]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: univ-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin-change-me}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [frontend]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
