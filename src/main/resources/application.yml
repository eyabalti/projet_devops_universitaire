server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
spring:
  application:
    name: gestion-universitaire
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:universite}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:universite}
    password: ${DB_PASSWORD:universite123}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
